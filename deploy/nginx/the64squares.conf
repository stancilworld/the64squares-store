# Installed by deploy/setup-vps.sh. certbot adds the HTTPS parts.
# Only The64Squares addresses are listed here; other sites on this server are untouched.

server {
  listen 80;
  server_name __STORE_DOMAIN__;

  location / {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  server_name __API_DOMAIN__;
  client_max_body_size 100m;

  location /static/ {
    alias /opt/the64squares/uploads/;
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    proxy_pass http://127.0.0.1:9100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
